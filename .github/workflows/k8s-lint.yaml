name: Kubernetes Manifest Validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/k8s-lint.yaml"
      - "clusters/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - ".github/workflows/k8s-lint.yaml"
      - "clusters/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: '3.14'

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.21.3

      - name: Setup kubeconform
        run: |
          wget https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Helm Releases
        run: uv run scripts/validate_releases.py
